name: agent-runtime

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agent_runtime
      POSTGRES_USER: agent_runtime
      POSTGRES_PASSWORD: agent_runtime
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_runtime -d agent_runtime"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      AGENT_RUNTIME_APP_ENV: development
      AGENT_RUNTIME_DATABASE_URL: postgresql+psycopg://agent_runtime:agent_runtime@postgres:5432/agent_runtime
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:

